## Test base conf: every setting equals the built-in default of v1.7.1, so the suites that were written
## against those defaults keep testing the same behaviour. The shipped conf is tested separately.
profiles =
regions =
all_regions = no
discover = yes
probe_parallel = 8
engines =
identifiers =
max_behind = 2
warn_days = 180
non_compliant_only = no
oracle_any_patch_line = no
fail_on_noncompliant = no
exceptions =
exception_warn_days = 14
formats = text
output_dir =
prefix = rds_patch_compliance
tz = Asia/Kolkata
log_file =
verbose = no
alert_emails =
alert_from =
alert_on = noncompliant
attach_html = yes
attach_csv = yes
attach_prefix = patch_compliance
mail_timeout = 60
alert_webhooks =
alert_webhook_format = slack
slack_max_chars = 35000
webhook_timeout = 20
webhook_retries = 2
aws_timeout = 30
max_attempts = 5
aws_retry_mode = standard
