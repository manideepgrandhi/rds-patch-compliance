## rds_patch_compliance_report.conf - the ONE settings file for rds_patch_compliance_report.sh and
## rds_patch_compliance_summary.sh (v1.7.1+).
##
## Keep this file next to the scripts. It is loaded automatically and every setting must be in it:
## the scripts have no built-in values. Use --config FILE to run with another complete copy.
##
## How to read it:
##   Lines starting with ## are notes. Every other line is one setting:  key = value
##   An empty value (key =) means what the note above it says. Each key appears once.
##   Command-line options override a value for one run, e.g. --max-behind 3 or -r us-east-1.
##   A trailing  # comment  after a value is ignored. The file is read as text, never run as a script.
##
## Fake account numbers below (111111111111 / 222222222222): replace them with yours.


## ============================== Accounts and regions ==============================
## AWS CLI profiles, comma-separated, one per account.   Allowed: profile names.   Example: prod,nonprod,dev
## Empty = the account you are logged in to (for example the jump box IAM role or CloudShell).
profiles =
## yes = scan every region enabled in the account. no = scan only the regions listed in regions below.
## Allowed: yes / no.   Example: all_regions = yes
all_regions = yes
## Regions to scan when all_regions = no, comma-separated.   Allowed: AWS region names.   Example: us-east-1,ap-south-1
## Empty = the default region of the profile. A -r option on the command line replaces all_regions = yes.
regions =
## yes = with all_regions = yes, first probe each region (2 quick calls) and scan in full only the regions that
## have databases. no = scan every enabled region in full (slower).   Allowed: yes / no.
discover = yes
## How many regions are probed at the same time.   Allowed: 1-32.   Example: 8
probe_parallel = 8
## Only check engines matching these patterns, comma-separated (* and ? work, case does not matter).
## Allowed: engine names such as aurora-postgresql, aurora-mysql, postgres, mysql, mariadb, oracle-*, sqlserver-*,
## docdb, neptune.   Example: aurora-*,postgres     Empty = all engines.
engines =
## Only check clusters / instances whose identifier matches these patterns, comma-separated (* and ? work).
## Example: prod-*,billing-aurora-mysql     Empty = all databases.
identifiers =


## ============================== Compliance rule ==============================
## A server is COMPLIANT when RDS lists at most this many valid minor upgrade targets for its version;
## one more than that = NON-COMPLIANT.   Allowed: whole number, 0 or more.   Example: 2 = up to 2 versions behind is OK.
max_behind = 2
## Flag major versions whose standard support ends within this many days (the "support ending" flag).
## Allowed: whole number, 0 or more.   Example: 180
warn_days = 180
## yes = list only NON-COMPLIANT servers in the report (the totals still count everything).
## Allowed: yes / no.   Example: non_compliant_only = no
non_compliant_only = no
## Oracle only. no = count upgrade targets on the same patch line only (mrp to mrp, rur to rur, RU to RU).
## yes = count targets on other patch lines too.   Allowed: yes / no.
oracle_any_patch_line = no
## yes = the script exits with code 5 when a server is NON-COMPLIANT (handy for schedulers / CI).
## Allowed: yes / no.   Example: fail_on_noncompliant = no
fail_on_noncompliant = no
## Compliance exceptions file (servers allowed to stay behind until a date).   Allowed: a file path.
## Example: ./compliance_exceptions.conf     Empty = compliance_exceptions.conf next to the script, if it exists.
exceptions =

## A compliance exception is flagged "expiring soon" this many days before its expiry date.
## Allowed: whole number, 0 or more.   Example: 14
exception_warn_days = 14


## ============================== Report files ==============================
## Report formats, comma-separated.   Allowed: text, csv, json, html.   Example: html,csv
## Several formats need output_dir. With one format and no output_dir the report is printed on the screen.
formats = csv,html,txt
## Folder for the report files (relative paths start from the folder you run the script in; it is created).
## Allowed: a folder path.   Example: ~/compliance-reports     Empty = print one format on the screen.
output_dir = ./reports
## Start of every report file name: <prefix>_<account>_<date>_<time>.html / .csv.
## Allowed: letters, digits, dot, underscore, hyphen.   Example: rds_patch_compliance
prefix = rds_patch_compliance
## Second time zone shown next to UTC in the report.   Allowed: a time zone name.   Example: Asia/Kolkata
tz = Asia/Kolkata
## Log file; every run adds its log lines here.   Allowed: a file path.   Example: ./reports/run.log
## Empty = no log file (messages still appear on the screen).
log_file = ./reports/run.log
## yes = also print debug lines (every AWS call).   Allowed: yes / no.   Example: verbose = no
verbose = no


## ============================== E-mail and webhook alerts ==============================
## Who gets the alert e-mail, comma-separated.   Allowed: e-mail addresses.
## Example: dba-team@example.com,oncall@example.com     Empty = no e-mail.
## With sendmail the mail has an HTML summary, a text version and attachments. mail / mailx send the text summary only.
alert_emails =
## From address of the alert e-mail.   Allowed: one e-mail address.   Example: rds-reports@example.com
## Empty = the mail system's default sender.
alert_from =
## When to send alerts.   Allowed: noncompliant (only when a server is NON-COMPLIANT or an AWS call failed) / always.
alert_on = noncompliant
## yes = attach the HTML report to the e-mail (sendmail only).   Allowed: yes / no.
attach_html = yes
## yes = attach the per-server CSV to the e-mail (sendmail only). The regions CSV is never attached.
## Allowed: yes / no.
attach_csv = yes
## Short name used only for the e-mail attachments: <attach_prefix>_YYYY-MM-DD.html / .csv.
## Allowed: letters, digits, dot, underscore, hyphen.   Example: patch_compliance
## The files in output_dir keep their full names.
attach_prefix = patch_compliance
## Seconds the mail command may run before it is stopped.   Allowed: whole number, 1 or more.   Example: 60
mail_timeout = 60
## Webhook addresses (Slack or JSON), comma-separated.   Allowed: https:// URLs.
## Example: https://hooks.slack.com/services/XXX/YYY/ZZZ     Empty = no webhook.
alert_webhooks =
## Payload shape for the webhooks.   Allowed: slack / json.
alert_webhook_format = slack
## Longest text sent to a Slack webhook; longer text is cut and marked.   Allowed: whole number, 1 or more.
## Example: 35000
slack_max_chars = 35000
## Seconds a webhook call may take before it is given up.   Allowed: whole number, 1 or more.   Example: 20
webhook_timeout = 20
## How many times a failed webhook call is retried.   Allowed: whole number, 0 or more (0 = no retry).   Example: 2
webhook_retries = 2


## ============================== AWS calls ==============================
## Seconds the AWS CLI waits to connect and to read before giving up on one call.
## Allowed: whole number, 1 or more.   Example: 30
aws_timeout = 30
## How many times the AWS CLI tries one call before it fails.   Allowed: whole number, 1 or more.   Example: 5
max_attempts = 5
## How the AWS CLI retries throttled calls.   Allowed: standard / adaptive / legacy.   Example: standard
## (The AWS_RETRY_MODE environment variable, if set, wins over this value.)
aws_retry_mode = standard


## ============================== Account names (display only) ==============================
## 12-digit account number = friendly name, shown as "name (number)" in the reports and e-mails.
## Accounts not listed show their IAM account alias, else the number.   Example: 111111111111 = prod-payments
111111111111 = prod-payments
222222222222 = nonprod-shared
