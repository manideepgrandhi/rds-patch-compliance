name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the release for, e.g. v1.3.1'
        required: true
# least privilege: read-only by default, write only for the job that publishes
permissions:
  contents: read
jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # pinned to a full commit SHA (tags are mutable); bump SHA and comment together
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Build rds-patch-compliance.zip (runtime files only)
        run: |
          set -euo pipefail
          D=dist/rds-patch-compliance; mkdir -p "$D"
          # runtime only: no docs/, samples/, tests/, .github/
          for f in rds_patch_compliance_report.sh rds_patch_compliance_summary.sh lib README.md \
                   rds_patch_compliance_report.conf.example EXAMPLES.md LICENSE; do
            [ -e "$f" ] && cp -a "$f" "$D/"
          done
          chmod +x "$D"/*.sh
          cd dist && zip -rqX rds-patch-compliance.zip rds-patch-compliance
          unzip -Z rds-patch-compliance.zip
          ! unzip -Z1 rds-patch-compliance.zip | grep -E '/(docs|samples|tests|\.github)/'
          # checksum published next to the zip; README install verifies it with sha256sum -c
          sha256sum rds-patch-compliance.zip > rds-patch-compliance.zip.sha256
          sha256sum -c rds-patch-compliance.zip.sha256
          unzip -q rds-patch-compliance.zip -d check && ./check/rds-patch-compliance/rds_patch_compliance_report.sh --version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/rds-patch-compliance.zip dist/rds-patch-compliance.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/rds-patch-compliance.zip dist/rds-patch-compliance.zip.sha256 --title "$TAG" --notes "rds-patch-compliance $TAG. CloudShell: curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/rds-patch-compliance.zip && curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/rds-patch-compliance.zip.sha256 && sha256sum -c rds-patch-compliance.zip.sha256 && unzip -oq rds-patch-compliance.zip && cd rds-patch-compliance"
          fi
