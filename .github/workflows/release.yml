name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the release for, e.g. v1.3.1'
        required: true
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Build rds-patch-compliance.zip (runtime files only)
        run: |
          set -euo pipefail
          D=dist/rds-patch-compliance; mkdir -p "$D"
          # runtime only: no docs/, samples/, tests/, .github/
          for f in rds_patch_compliance_report.sh rds_patch_compliance_summary.sh lib README.md \
                   rds_patch_compliance_report.conf.example EXAMPLES.md LICENSE; do
            [ -e "$f" ] && cp -a "$f" "$D/"
          done
          chmod +x "$D"/*.sh
          cd dist && zip -rqX rds-patch-compliance.zip rds-patch-compliance
          unzip -Z rds-patch-compliance.zip
          ! unzip -Z1 rds-patch-compliance.zip | grep -E '/(docs|samples|tests|\.github)/'
          unzip -q rds-patch-compliance.zip -d check && ./check/rds-patch-compliance/rds_patch_compliance_report.sh --version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/rds-patch-compliance.zip --clobber
          else
            gh release create "$TAG" dist/rds-patch-compliance.zip --title "$TAG" --notes "rds-patch-compliance $TAG. CloudShell: curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/rds-patch-compliance.zip && unzip -oq rds-patch-compliance.zip && cd rds-patch-compliance"
          fi
